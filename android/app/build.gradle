plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.mpitsol.darttracker"
    compileSdk = 35
    ndkVersion = "28.0.13004108"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.mpitsol.darttracker"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 21 // Upewnij się, że ta wartość jest poprawna
        targetSdk = 35 // Upewnij się, że ta wartość jest poprawna
        versionCode = 3 // Upewnij się, że ta wartość jest poprawna
        versionName = "2.0" // Upewnij się, że ta wartość jest poprawna
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // Fallback to debug signing when release keystore is not configured,
            // so CI/local verification builds can still run.
            signingConfig = signingConfigs.findByName("release") ?: signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

tasks.register("check16KbPages", Exec) {
    workingDir rootDir.parentFile
    if (isWindows) {
        commandLine "powershell", "-ExecutionPolicy", "Bypass", "-File", "scripts/check-android-16kb.ps1"
    } else {
        commandLine "pwsh", "-File", "scripts/check-android-16kb.ps1"
    }
}

tasks.matching { it.name == "assembleRelease" }.configureEach {
    finalizedBy(tasks.named("check16KbPages"))
}